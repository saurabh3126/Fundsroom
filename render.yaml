services:

  # ==============================
  # BACKEND - EXPRESS / NODE
  # ==============================

  - type: web
    name: fundsroom-api
    runtime: node
    rootDir: server

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: fundsroom-db
          property: connectionString

      - key: JWT_SECRET
        sync: false


  # ==============================
  # FRONTEND - REACT / VITE
  # ==============================

  - type: web
    name: fundsroom-client
    runtime: static
    rootDir: client

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        value: https://fundsroom-api.onrender.com


# ==============================
# POSTGRESQL DATABASE
# ==============================

databases:

  - name: fundsroom-db